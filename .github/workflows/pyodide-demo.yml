name: Pyodide demo

# Builds the Trio wheel from this branch, bundles it with the static page in
# demo/, and publishes the result with GitHub Pages. One-time setup in the
# repository settings: under Pages, set the source to "GitHub Actions".

on:
  push:
    branches:
      - pyodide-support
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the demo site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          # The same CPython minor version as the Pyodide release demo.js
          # loads, so pip resolves Trio's dependencies for that interpreter.
          python-version: '3.14'
      - name: Collect the wheels
        run: |
          python -m pip install build
          python demo/build_wheels.py
      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: demo

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
