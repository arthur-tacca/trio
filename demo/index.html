<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trio in the browser</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; }
    section { margin: 1.5rem 0; padding: 1rem; border: 1px solid #ccc; border-radius: 6px; }
    h2 { margin-top: 0; font-size: 1.1rem; }
    button { margin-right: .5rem; }
    pre { background: #f4f4f4; padding: .5rem; white-space: pre-wrap; }
    #trace { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9rem; white-space: pre-wrap; }
    #status { font-weight: bold; }
    .muted { color: #666; }
  </style>
</head>
<body>
  <h1>Trio running in Pyodide</h1>
  <p class="muted"><a href="https://github.com/arthur-tacca/trio/tree/pyodide-support">Source on GitHub: arthur-tacca/trio, branch pyodide-support</a></p>
  <p id="status">Loading…</p>

  <section>
    <h2>A nursery of sleeping tasks</h2>
    <button id="start-btn" disabled>Start</button>
    <button id="cancel-btn" disabled>Cancel</button>
    <ul id="trace"></ul>
  </section>

  <section>
    <h2>fetch, with Trio timeouts</h2>
    <button id="fetch-btn" disabled>Fetch hello.txt</button>
    <button id="fetch-cancel-btn" disabled>Stream a file, cancelled after 0.3 s</button>
    <pre id="fetch-out"></pre>
  </section>

  <section>
    <h2>JavaScript awaiting a Trio function</h2>
    <button id="js-call-btn" disabled>await trioDouble(21) from JavaScript</button>
    <span id="js-call-out" class="muted"></span>
  </section>

  <!-- The workflow replaces __BUILD__ with the commit, so a new deploy never
       mixes files from an older one that a browser or the CDN has cached -->
  <script type="module" src="demo.js?v=__BUILD__"></script>
</body>
</html>
